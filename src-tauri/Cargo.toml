[package]
name = "s3-sidekick"
version = "0.11.1"
description = "Cross-platform desktop client for S3-compatible object storage."
authors = ["BurntToasters <code@rosie.run>"]
edition = "2021"
# MSRV floor tracks the pinned release toolchain below (npm run rust:update).
rust-version = "1.98.0"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-process = "=2.4.0"
tauri-plugin-notification = "=2.5.0"
aws-sdk-s3 = { version = "=1.144.0", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
tokio = { version = "=1.53.1", features = ["full"] }
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
pbkdf2 = "=0.12.2"
rand = "=0.8.7"
sha2 = "=0.10.9"
subtle = "=2.6.1"
urlencoding = "=2.1.3"
zeroize = "=1.9.0"
fs2 = "=0.4.3"
bytes = "=1.12.1"

tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-updater = "=2.13.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
core-foundation = "=0.9.4"
security-framework-sys = "=2.17.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.58.0", features = [
    "Security_Credentials_UI",
    "Foundation",
    "Win32_Security_Credentials",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tauri = { version = "=2.12.0", features = ["test"] }
# Parses the command signatures for the generated IPC contract. Already in
# the graph through the Tauri macros; pinned to the locked version.
syn = { version = "=2.0.119", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
strip = true
