name: CI

on:
  push:
  pull_request:
    branches: [main, beta, next-0.11.0]
  schedule:
    # Weekly re-audit catches advisories published against unchanged pins.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.20.0"
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "1.98.0"

jobs:
  verify:
    name: Test + Format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
          cache-targets: false
          prefix-key: v2-${{ matrix.os }}
          key: ${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # Release baseline is pinned to Ubuntu 22.04 (see runs-on matrix):
        # ships libwebkit2gtk-4.1 + libayatana-appindicator3. libxdo-dev is
        # required by Tauri window automation on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            gnupg

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --ignore-scripts

      - name: Audit build and development dependencies
        run: npm audit --audit-level=high --ignore-scripts

      - name: Install pinned Cargo advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked Cargo dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Enforce dependency license and source policy
        run: npm run licenses

      - name: Run test suite and formatting checks
        run: npm run test:all

      - name: Show generated schema drift
        if: failure()
        run: git diff -- src-tauri/gen/schemas

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build frontend
        run: npm run build

      - name: Run multipart response-loss E2E
        run: npm run test:e2e:multipart-recovery

      - name: Run move receipt safety E2E
        run: npm run test:e2e:move-safety

      - name: Run release safety E2E
        if: runner.os == 'Linux'
        run: npm run test:e2e:release-safety

      - name: Run Windows publication E2E
        if: runner.os == 'Windows'
        run: npm run test:e2e:windows-publication

      - name: Upload native transfer regression reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transfer-regressions-${{ matrix.os }}
          path: |
            test-results/fixes-0.11.1/transfer-publication/multipart-recovery/
            test-results/fixes-0.11.1/transfer-publication/windows-publication/
            test-results/move-safety-e2e/
            test-results/release-assets-e2e/
            test-results/release-preflight-origin-e2e/
            test-results/aws-null-runner-e2e/
          if-no-files-found: ignore
          retention-days: 14

  browser-layout:
    name: Browser layout (Chromium + WebKit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser layout harness
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright-report.json
        run: npm run test:ui -- --add-reporter=json

      - name: Run script E2E suites
        run: npm run test:e2e:scripts

      - name: Run full-stack deadline and artifact E2E
        run: npm run test:e2e:fullstack-harness

      - name: Run Windows publication runner failure-first E2E
        run: npm run test:e2e:windows-publication-harness

      - name: Upload full-stack harness reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullstack-harness-report
          path: test-results/fixes-0.11.1/transfer-publication/fullstack-harness/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows publication harness reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-publication-harness-report
          path: test-results/fixes-0.11.1/transfer-publication/windows-publication-harness/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-layout-e2e
          path: |
            test-results/playwright-report.json
            test-results/playwright/**/inspector-close-race.json
            test-results/playwright/**/inspector-after-delayed-sync.png
            test-results/playwright/**/error-context.md
            test-results/playwright/**/test-failed-*.png
            test-results/playwright/**/trace.zip
            test-results/frontend-safety/
            test-results/ui-security-regressions/
          if-no-files-found: ignore
          retention-days: 14

  minio-e2e:
    name: S3 command layer E2E (MinIO)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
          cache-targets: false
          prefix-key: v2-minio-e2e
          key: ${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The Tauri context embeds the built frontend at compile time.
      - name: Build frontend
        run: npm run build

      - name: Run MinIO E2E suite
        run: npm run test:e2e:minio

      - name: Upload MinIO E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minio-e2e-report
          path: test-results/minio-e2e/
          if-no-files-found: ignore
          retention-days: 14

  fullstack-e2e:
    name: Full-stack E2E (real app + MinIO)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
          cache-targets: false
          prefix-key: v2-fullstack-e2e
          key: ${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies and WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            gdb \
            webkit2gtk-driver \
            x11-utils \
            xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build debug app
        run: npm run tauri -- build --debug --no-bundle -- --locked

      - name: Warm font cache for first GTK paint
        run: |
          fc-cache -f >/dev/null 2>&1 || true
          fc-list | wc -l

      - name: Run full-stack E2E
        env:
          S3_SIDEKICK_E2E_STARTUP_TRACE: "1"
        run: xvfb-run --auto-servernum npm run test:e2e:fullstack

      - name: Upload full-stack report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullstack-e2e-report
          path: test-results/fullstack/
          if-no-files-found: ignore
          retention-days: 14

  rust-coverage:
    name: Rust coverage (report only)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libdbus-1-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The Tauri context embeds the built frontend at compile time.
      - name: Build frontend
        run: npm run build

      # Report only: no threshold yet. Establish a baseline before gating.
      - name: Measure Rust coverage
        run: |
          cargo llvm-cov --locked --manifest-path src-tauri/Cargo.toml --summary-only | tee rust-coverage.txt
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --lcov --output-path rust-coverage.lcov
          tail -n 3 rust-coverage.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage
          path: |
            rust-coverage.txt
            rust-coverage.lcov
          retention-days: 14
