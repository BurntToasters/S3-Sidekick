# Partial-auth port: a public key must succeed first, then a password. A client
# that presents only a key gets a partial success naming the password method.
Port 12225
ListenAddress 0.0.0.0
HostKey /etc/ssh/e2e/partial_ed25519
PidFile /run/sshd-partial.pid
PermitRootLogin no
AuthenticationMethods publickey,password
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
AuthorizedKeysFile .ssh/authorized_keys
Subsystem sftp /usr/lib/openssh/sftp-server
LogLevel VERBOSE
