# No-hardlink port: the main host keys, but sftp-server denies every
# hardlink@openssh.com request. OpenSSH then leaves the extension out of its
# version reply, so this port runs the lstat + rename commit that servers
# without hardlinks get. Every other port always offers the extension.
Port 12226
ListenAddress 0.0.0.0
HostKey /etc/ssh/e2e/main_ed25519
HostKey /etc/ssh/e2e/main_ecdsa
PidFile /run/sshd-nolink.pid
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
AuthorizedKeysFile .ssh/authorized_keys
Subsystem sftp /usr/lib/openssh/sftp-server -P hardlink
LogLevel VERBOSE
