# Main test port: Ed25519 and ECDSA host keys, password, public key, and PAM
# keyboard-interactive. Every positive connect check runs against this port.
Port 12222
ListenAddress 0.0.0.0
HostKey /etc/ssh/e2e/main_ed25519
HostKey /etc/ssh/e2e/main_ecdsa
PidFile /run/sshd-main.pid
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
AuthorizedKeysFile .ssh/authorized_keys
Subsystem sftp /usr/lib/openssh/sftp-server
LogLevel VERBOSE
