# RSA-only port: the only host key is RSA, so the client must refuse it during
# negotiation with the RSA host key message.
Port 12223
ListenAddress 0.0.0.0
HostKey /etc/ssh/e2e/rsa
PidFile /run/sshd-rsa.pid
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
AuthorizedKeysFile .ssh/authorized_keys
Subsystem sftp /usr/lib/openssh/sftp-server
LogLevel VERBOSE
